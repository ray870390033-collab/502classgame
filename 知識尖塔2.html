<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>知識尖塔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：教室黑板。深綠板面＋粉筆線條，卡牌是白色單字卡，題目是紅筆批改的考卷。 */
:root {
  color-scheme: dark;
  --board: #1d332e; --board-hi: #26443d; --board-lo: #14251f;
  --chalk: #f4f1e6; --chalk-2: #c7d1c8; --chalk-3: #8ea69b;
  --yellow: #f3d65f; --pink: #f08ba0; --sky: #7fc3f2; --mint: #92dba0; --violet: #b9a2f4; --orange: #f4a35e;
  --wood: #7a4f2d; --wood-hi: #a0703f;
  --paper: #fbf8ee; --ink: #25302c; --ink-2: #5a6862; --rule: #cfe0d6; --red-pen: #d6453d;
  --c-warrior: #f0806f; --c-mage: #7fb4ff; --c-archer: #8fd695; --c-rogue: #b9a2f4;
  --t-attack: #e9806e; --t-skill: #6fa8dc; --t-power: #e7c14f;
  --good: #8fe0a0; --bad: #ff8f84;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "KaiTi", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--board); color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

#app {
  height: 100%; position: relative; max-width: 1280px; margin-inline: auto;
  border: 9px solid var(--wood); border-radius: 12px; overflow: hidden;
  box-shadow: inset 0 0 0 2px var(--wood-hi), inset 0 0 60px rgba(0, 0, 0, .35), 0 0 0 2px rgba(0, 0, 0, .35);
  background:
    radial-gradient(900px 500px at 15% 12%, rgba(255, 255, 255, .05), transparent 60%),
    radial-gradient(700px 400px at 90% 85%, rgba(255, 255, 255, .04), transparent 60%),
    linear-gradient(180deg, var(--board-hi), var(--board) 40%, var(--board-lo));
}
.screen { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 22px clamp(14px, 3vw, 36px) 30px; display: flex; flex-direction: column; }

/* ---------- 按鈕（粉筆框） ---------- */
.btn {
  border: 2.5px solid var(--chalk); background: transparent; border-radius: 255px 14px 225px 14px / 14px 225px 14px 255px;
  padding: 9px 22px; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; color: var(--chalk);
  transition: transform .12s, background .15s; min-height: 44px;
}
.btn:hover { background: rgba(255, 255, 255, .09); transform: translateY(-2px) rotate(-.6deg); }
.btn:active { transform: translateY(0); }
.btn.primary { border-color: var(--yellow); color: var(--yellow); background: rgba(243, 214, 95, .1); font-size: 1.55rem; padding: 14px 44px; }
.btn.primary:hover { background: rgba(243, 214, 95, .2); }
.btn.small { font-size: .95rem; padding: 5px 14px; min-height: 36px; border-width: 2px; }
.btn.ghost { border-color: var(--chalk-3); color: var(--chalk-2); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.link { background: none; border: 0; color: var(--sky); text-decoration: underline; text-underline-offset: 3px; padding: 4px; }

/* ---------- 首頁 ---------- */
.title-screen { align-items: center; justify-content: center; text-align: center; gap: 0; }
.title-screen .tower { width: clamp(84px, 14vh, 130px); color: var(--chalk-2); opacity: .9; margin-bottom: 6px; }
.title-screen h1 { font-size: clamp(2.6rem, 8vw, 4.6rem); letter-spacing: .14em; padding-left: .14em; text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.title-screen .sub { font-family: var(--f-display); color: var(--chalk-2); font-size: clamp(1rem, 2.4vw, 1.3rem); margin: 6px 0 28px; }
.title-screen .stack { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.title-screen .bankline { margin-top: 26px; color: var(--chalk-3); font-size: .9rem; }
.underline-chalk { display: block; width: min(280px, 60%); height: 8px; margin: 8px auto 0; color: var(--yellow); }

/* ---------- 共用頁首 ---------- */
.topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.topbar h2 { font-size: 1.7rem; letter-spacing: .08em; }
.topbar .spacer { flex: 1; }

/* ---------- 設定 ---------- */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.panel { border: 2px dashed var(--chalk-3); border-radius: 14px; padding: 16px 18px; min-width: 0; background: rgba(0, 0, 0, .12); }
.panel.full { grid-column: 1 / -1; }
.panel h3 { font-size: 1.25rem; margin-bottom: 10px; color: var(--yellow); letter-spacing: .05em; }
.panel .note { color: var(--chalk-2); font-size: .92rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--chalk-3); border-radius: 999px; padding: 3px 12px; font-size: .9rem; background: transparent; color: var(--chalk-2); min-height: 32px; }
.chip[aria-pressed="true"] { border-color: var(--mint); color: var(--mint); background: rgba(146, 219, 160, .12); }
.seg { display: inline-flex; border: 2px solid var(--chalk-3); border-radius: 12px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 7px 16px; color: var(--chalk-2); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--yellow); color: #2a2a18; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 6px; }
textarea, input[type="text"] {
  width: 100%; background: rgba(0, 0, 0, .28); color: var(--chalk); border: 2px solid var(--chalk-3); border-radius: 10px; padding: 10px 12px; font: inherit;
}
textarea { min-height: 150px; resize: vertical; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .88rem; line-height: 1.5; }
textarea::placeholder, input::placeholder { color: var(--chalk-3); }
input[type="file"] { color: var(--chalk-2); max-width: 100%; }
.msg { margin-top: 10px; padding: 8px 12px; border-radius: 10px; font-size: .92rem; }
.msg.ok { background: rgba(146, 219, 160, .14); color: var(--good); }
.msg.err { background: rgba(255, 143, 132, .13); color: var(--bad); }
.msg ul { margin: 6px 0 0; padding-left: 18px; max-height: 120px; overflow: auto; }
.tablewrap { overflow-x: auto; }
table.cols { border-collapse: collapse; font-size: .9rem; min-width: 460px; width: 100%; }
table.cols th, table.cols td { border-bottom: 1px solid rgba(255, 255, 255, .15); padding: 5px 8px; text-align: left; vertical-align: top; }
table.cols th { color: var(--yellow); font-weight: 500; white-space: nowrap; }
pre.sample { background: rgba(0, 0, 0, .3); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-size: .85rem; margin: 8px 0; white-space: pre; font-family: ui-monospace, Menlo, monospace; }
details summary { cursor: pointer; color: var(--sky); padding: 4px 0; }
.qlist { list-style: none; margin: 8px 0 0; padding: 0; max-height: 320px; overflow-y: auto; border: 1px solid rgba(255, 255, 255, .15); border-radius: 10px; }
.qlist li { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid rgba(255, 255, 255, .1); font-size: .9rem; }
.qlist li:last-child { border-bottom: 0; }
.qlist .qt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.qlist .tag { color: var(--chalk-3); font-size: .78rem; white-space: nowrap; }
.qlist button { background: none; border: 0; color: var(--bad); padding: 4px 8px; }
.tog { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.tog input { width: 20px; height: 20px; accent-color: var(--yellow); }

/* ---------- 名字 / 職業 ---------- */
.center-col { max-width: 520px; margin: auto; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 18px; align-items: center; }
.center-col h2 { font-size: 2rem; letter-spacing: .1em; }
.name-input { font-family: var(--f-display); font-size: 1.8rem; text-align: center; max-width: 360px; border: 0; border-bottom: 3px dashed var(--chalk-2); border-radius: 0; background: transparent; padding: 8px; }
.classes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-block: 4px 20px; }
.cls { text-align: left; border: 2.5px solid var(--chalk-3); border-radius: 16px; padding: 16px; background: rgba(0, 0, 0, .15); display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: transform .15s, border-color .15s; }
.cls:hover { transform: translateY(-3px); }
.cls[aria-pressed="true"] { border-color: var(--cc); background: rgba(255, 255, 255, .07); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc) 35%, transparent); }
.cls .head { display: flex; align-items: center; gap: 12px; }
.cls .ava { width: 58px; height: 58px; border-radius: 50%; border: 2.5px solid var(--cc); color: var(--cc); display: grid; place-items: center; flex: none; background: rgba(0, 0, 0, .2); }
.cls h3 { font-size: 1.6rem; color: var(--cc); letter-spacing: .1em; }
.cls .tag { font-family: var(--f-display); color: var(--chalk-2); font-size: .95rem; }
.cls .hp { font-weight: 700; }
.cls .blurb { font-size: .9rem; color: var(--chalk-2); }
.cls .traits { font-size: .82rem; color: var(--chalk-3); }
.rates { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: .82rem; align-items: center; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--chalk-3); }
.dots i.on { background: var(--cc); border-color: var(--cc); }
.cls .starter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .78rem; color: var(--chalk-3); }

/* ---------- 卡牌 ---------- */
.card {
  --tc: var(--t-attack);
  position: relative; flex: none; width: 124px; height: 178px; border: 2.5px solid var(--ink); border-radius: 10px;
  background: var(--paper); color: var(--ink); padding: 0; display: flex; flex-direction: column; text-align: center; overflow: visible;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 6px 14px rgba(0, 0, 0, .3);
  transition: transform .15s ease, box-shadow .15s, opacity .15s, filter .15s;
  transform: translateY(var(--dy, 0px)) rotate(var(--rot, 0deg));
  font-family: var(--f-body);
}
.card.t-skill { --tc: var(--t-skill); }
.card.t-power { --tc: var(--t-power); }
.card.r-uncommon { border-color: #3a6fb8; }
.card.r-rare { border-color: #bb8a1b; box-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 0 0 2px rgba(231, 193, 79, .55), 0 6px 14px rgba(0, 0, 0, .3); }
.card .cname { background: var(--tc); border-radius: 6px 6px 0 0; padding: 4px 6px 4px 28px; font-family: var(--f-display); font-weight: 700; font-size: .98rem; line-height: 1.2; min-height: 30px; display: flex; align-items: center; justify-content: center; color: #1c1c1c; text-wrap: balance; }
.card .cost { position: absolute; left: -9px; top: -9px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--yellow); border: 2px solid var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; display: grid; place-items: center; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
.card .art { height: 52px; margin: 6px 12px 0; border-radius: 8px; background: color-mix(in srgb, var(--tc) 22%, var(--paper)); display: grid; place-items: center; color: var(--ink); border: 1.5px dashed color-mix(in srgb, var(--tc) 70%, var(--ink)); }
.card .ctype { font-size: .68rem; letter-spacing: .2em; color: var(--ink-2); margin-top: 4px; padding-left: .2em; }
.card .cdesc { flex: 1; padding: 2px 8px 8px; font-size: .78rem; line-height: 1.35; display: flex; align-items: center; justify-content: center; font-weight: 500; }
.card .rar { position: absolute; right: 6px; bottom: 5px; width: 8px; height: 8px; transform: rotate(45deg); background: #a5aeaa; }
.card.r-uncommon .rar { background: #3a6fb8; }
.card.r-rare .rar { background: #e0a820; box-shadow: 0 0 4px #e0a820; }
.card.r-basic .rar, .card.r-token .rar { display: none; }
.card.pwr::after { content: "能力"; position: absolute; top: 36px; right: -7px; background: var(--ink); color: var(--yellow); font-size: .6rem; padding: 0 5px; border-radius: 3px; letter-spacing: .08em; }
.card.big { width: 168px; height: 240px; }
.card.big .cname { font-size: 1.15rem; min-height: 38px; padding-left: 34px; }
.card.big .art { height: 74px; }
.card.big .cdesc { font-size: .95rem; padding: 4px 12px 12px; }
.card.mini { width: 92px; height: 132px; }
.card.mini .cname { font-size: .78rem; min-height: 24px; padding-left: 20px; }
.card.mini .cost { width: 24px; height: 24px; font-size: .85rem; left: -7px; top: -7px; }
.card.mini .art { height: 34px; margin: 4px 8px 0; }
.card.mini .art svg { width: 22px; height: 22px; }
.card.mini .cdesc { font-size: .66rem; padding: 2px 6px 6px; }
.card.mini .ctype { display: none; }
button.card:hover:not([disabled]) { --dy: -12px; z-index: 5; }
.card.sel { --dy: -30px; z-index: 8; box-shadow: 0 0 0 3px var(--yellow), 0 12px 22px rgba(0, 0, 0, .45); }
.card.dis { filter: saturate(.35) brightness(.78); }
.card.chosen { box-shadow: 0 0 0 4px var(--mint), 0 8px 16px rgba(0, 0, 0, .4); --dy: -10px; }
.card.reward { cursor: pointer; }
.card.reward:hover { --dy: -10px; }

/* ---------- 戰鬥 ---------- */
.battle { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 10px clamp(10px, 2vw, 22px) 10px; gap: 6px; }
.hud { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hud .who { font-family: var(--f-display); font-size: 1.1rem; }
.hud .grow { flex: 1; }
.route { display: flex; align-items: center; gap: 5px; }
.route i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--chalk-3); display: block; }
.route i.done { background: var(--chalk-3); }
.route i.now { border-color: var(--yellow); background: var(--yellow); box-shadow: 0 0 0 3px rgba(243, 214, 95, .3); }
.route i.elite { border-radius: 3px; transform: rotate(45deg); }
.route i.boss { width: 18px; height: 18px; border-color: var(--pink); }
.route i.boss.done, .route i.boss.now { background: var(--pink); }
.arena { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-height: 0; padding-block: 4px; }
.pbox { width: 200px; flex: none; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.pbox .ava { width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--cc); color: var(--cc); display: grid; place-items: center; background: rgba(0, 0, 0, .22); }
.pbox .pname { font-family: var(--f-display); font-size: 1.1rem; }
.bar { position: relative; height: 20px; border: 2px solid var(--chalk-2); border-radius: 12px; background: rgba(0, 0, 0, .35); overflow: hidden; width: 100%; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--pink); transition: width .3s; border-radius: 10px; }
.bar.foe-bar i { background: #e0786b; }
.bar b { position: absolute; inset: 0; display: grid; place-items: center; font-size: .75rem; font-weight: 700; text-shadow: 0 1px 2px #000; }
.stat { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; border: 2px solid var(--chalk-3); font-size: .8rem; background: rgba(0, 0, 0, .2); white-space: nowrap; }
.stat.blk { border-color: var(--sky); color: var(--sky); }
.stat.bad { border-color: var(--bad); color: var(--bad); }
.stat.good { border-color: var(--mint); color: var(--mint); }
.stat.mana { border-color: var(--violet); color: var(--violet); }
.stat.warn { border-color: var(--orange); color: var(--orange); }
.stat.streak { border-color: var(--yellow); color: var(--yellow); }
.statline { display: flex; flex-wrap: wrap; gap: 5px; }
.foes { display: flex; gap: clamp(8px, 2vw, 26px); justify-content: center; align-items: flex-end; flex: 1; min-width: 0; flex-wrap: wrap; }
.foe { width: 150px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; padding: 4px; border-radius: 14px; border: 2px solid transparent; background: none; transition: opacity .4s, filter .4s; }
.foe .sprite { font-size: 68px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .28)); transition: transform .2s; }
.foe.elite .sprite { font-size: 84px; }
.foe.boss .sprite { font-size: 108px; }
.foe.boss, .foe.elite { width: 190px; }
.foe .fname { font-family: var(--f-display); font-weight: 700; }
.foe.dead { opacity: .14; filter: grayscale(1); pointer-events: none; }
.foe.targetable { cursor: pointer; border-color: var(--yellow); border-style: dashed; background: rgba(243, 214, 95, .08); animation: pulse 1s infinite; }
.foe.hit .sprite { animation: shake .35s; }
.foe.acting .sprite { animation: lunge .35s; }
.intent { display: flex; align-items: center; gap: 6px; padding: 2px 10px; border: 2px solid var(--orange); color: var(--orange); border-radius: 999px; font-weight: 700; background: rgba(0, 0, 0, .3); font-size: .9rem; min-height: 28px; }
.intent.sp { border-color: var(--sky); color: var(--sky); }
.pbox.hit .ava { animation: shake .35s; }
.float { position: fixed; z-index: 90; pointer-events: none; font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; text-shadow: 0 2px 0 #000, 0 0 8px rgba(0, 0, 0, .6); animation: floatup .95s ease-out forwards; transform: translateX(-50%); }
.float.dmg { color: #ffd2cc; } .float.pdmg { color: var(--bad); } .float.heal { color: var(--good); } .float.block { color: var(--sky); }
@keyframes floatup { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -64px; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes lunge { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(-26px) scale(1.08); } }
@keyframes pulse { 50% { background: rgba(243, 214, 95, .18); } }
.tray { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: end; padding-top: 8px; position: relative; }
.tray .side { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 6px; }
.orb { width: 74px; height: 74px; border-radius: 50%; border: 3px solid var(--yellow); color: var(--yellow); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; background: rgba(243, 214, 95, .1); line-height: 1; text-align: center; }
.orb small { display: block; font-size: .62rem; letter-spacing: .1em; font-family: var(--f-body); font-weight: 400; margin-top: 2px; }
.pilebtn { background: none; border: 2px solid var(--chalk-3); border-radius: 10px; color: var(--chalk-2); padding: 4px 10px; font-size: .82rem; min-height: 36px; }
.pilebtn:hover { background: rgba(255, 255, 255, .08); }
.hand { display: flex; gap: 6px; justify-content: center; align-items: flex-end; padding: 38px 14px 8px; overflow-x: auto; overflow-y: hidden; min-height: 226px; scrollbar-width: thin; }
.hand .card { margin-inline: 0; }
.hand.empty::before { content: "手牌用完了，按「結束回合」"; color: var(--chalk-3); align-self: center; font-family: var(--f-display); }
.hint { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); background: var(--yellow); color: #2a2a18; padding: 4px 14px; border-radius: 999px; font-weight: 700; font-size: .88rem; z-index: 20; white-space: nowrap; pointer-events: none; }
.endturn { font-size: 1.05rem; padding: 8px 18px; }

/* ---------- 彈窗 ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(6, 14, 12, .78); padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal[hidden] { display: none; }

const RANK_FLOORS = 50;
const tierOfIds = ids => ids.some(id => ENEMY_DEFS[id].tier === 'boss') ? 'boss' : ids.some(id => ENEMY_DEFS[id].tier === 'elite') ? 'elite' : 'normal';
/* 排行榜模式 50 關：每 5 關一隻菁英（5、10…45），第 50 關是 BOSS；敵人血量與傷害隨關卡增加 */
function makeFloors(mode) {
  if (mode !== 'rank') return CLASSIC_IDS.map(ids => ({ ids, tier: tierOfIds(ids), hpMul: 1, dmgMul: 1 }));
  const out = [];
  for (let f = 1; f <= RANK_FLOORS; f++) {
    const hpMul = 1 + RANK_SCALE.hp * (f - 1), dmgMul = 1 + RANK_SCALE.dmg * (f - 1);
    let ids;
    if (f === RANK_FLOORS) ids = ['dragon'];
    else if (f % 5 === 0) ids = [(f / 5) % 2 ? 'golem' : 'knight'];
    else {
      const pool = f <= 10 ? ['slime', 'bat', 'goblin', 'skeleton', 'wolf'] : f <= 25 ? ['goblin', 'skeleton', 'spider', 'wolf', 'ghost', 'bat'] : ['spider', 'ghost', 'orc', 'skeleton', 'wolf', 'goblin'];
      const n = f < 4 ? 1 : f < 16 ? 2 : 3;
      ids = Array.from({ length: n }, () => pool[rnd(pool.length)]);
    }
    const tier = tierOfIds(ids);
    out.push({ ids, tier, hpMul: hpMul * (tier === 'elite' ? 1.2 : tier === 'boss' ? 1.4 : 1), dmgMul });
  }
  return out;
}
const DIFF = { easy: { hp: .7, dmg: .6 }, normal: { hp: .85, dmg: .8 }, hard: { hp: 1, dmg: 1 }, rank: { hp: .7, dmg: .6 } };
const RANK_SCALE = { hp: .04, dmg: .025 };

let G = null, B = null;

/* ---------- 遊戲（一整趟） ---------- */
function newRun(cls, name, opts) {
  G = {
    cls, name, floor: 0, mode: (opts && opts.mode) || 'classic',
    opts: Object.assign({ diff: 'normal', streak: true }, opts || {}, (opts && opts.mode === 'rank') ? { diff: 'rank', streak: true } : {}),
    hp: CLASSES[cls].hp, maxHp: CLASSES[cls].hp,
    deck: CLASSES[cls].starter.slice(), streak: 0,
    stats: { asked: 0, correct: 0, played: 0, maxStreak: 0, curStreak: 0 }, missed: [],
  };
  G.floors = makeFloors(G.mode);
  B = null;
  return G;
}

function startBattle() {
  const diff = DIFF[G.opts.diff];
  const fl = G.floors[G.floor];
  const enemies = fl.ids.map((id, i) => {
    const d = ENEMY_DEFS[id];
    const hp = Math.max(1, Math.round(d.hp * diff.hp * fl.hpMul));
    return { id, i, name: d.n, sprite: d.s, tier: d.tier || 'normal', dmgMul: fl.dmgMul, hp, maxHp: hp, block: 0, str: 0, weak: 0, vuln: 0, poison: 0, burn: 0, mark: 0, mi: 0, intent: d.moves[0] };
  });
  B = {
    enemies, turn: 0, over: null, phase: 'init',
    draw: shuffle(G.deck.map(mk)), hand: [], discard: [], exhaust: [],
    p: { block: 0, str: 0, tempStr: 0, mana: 0, weak: 0, vuln: 0, energy: 0 },
    pw: {}, t: {}, nt: { draw: 0, energy: 0, block: 0, atk: 0 }, retainNext: 0,
  };
  startPlayerTurn();
  return B;
}

const living = () => B.enemies.filter(e => e.hp > 0);
const firstLiving = () => B.enemies.find(e => e.hp > 0);

function checkEnd() {
  if (B.over) return B.over;
  if (G.hp <= 0) B.over = 'lose';
  else if (!living().length) B.over = 'win';
  return B.over;
}

/* ---------- 基本動作 ---------- */
function ensureDraw(n) {
  if (B.draw.length < n && B.discard.length) { B.draw.push(...shuffle(B.discard.splice(0))); }
}
function drawCards(n) {
  for (let i = 0; i < n; i++) {
    ensureDraw(1);
    if (!B.draw.length) break;
    const c = B.draw.shift();
    if (B.hand.length >= HAND_MAX) B.discard.push(c); else B.hand.push(c);
  }
}
function addToHand(id, n) {
  for (let i = 0; i < n; i++) { const c = mk(id); if (B.hand.length >= HAND_MAX) B.discard.push(c); else B.hand.push(c); }
}
const gainMana = n => { B.p.mana = Math.min(MANA_MAX, B.p.mana + n); };

function hurtEnemy(e, n, pierce) {
  if (e.hp <= 0 || n <= 0) return 0;
  let left = n;
  if (!pierce && e.block > 0) { const a = Math.min(e.block, left); e.block -= a; left -= a; }
  e.hp = Math.max(0, e.hp - left);
  ui.fx('dmg', e, n);
  return left;
}
function hurtPlayer(n, opt = {}) {
  if (n <= 0) return 0;
  let left = n;
  if (!opt.pierce && B.p.block > 0) { const a = Math.min(B.p.block, left); B.p.block -= a; left -= a; }
  if (opt.self) left = Math.max(0, Math.min(left, G.hp - 1));
  ui.fx('pdmg', null, n);
  if (left > 0) {
    G.hp -= left; B.t.lostHp = true;
    if (B.pw.hpLossStr && (B.t.hpStrCount || 0) < 2) { B.p.str += B.pw.hpLossStr; B.t.hpStrCount = (B.t.hpStrCount || 0) + 1; }
    if (B.pw.hpLossBlock) B.p.block += B.pw.hpLossBlock;
  }
  checkEnd();
  return left;
}

/* ---------- 回合 ---------- */
function startPlayerTurn() {
  B.turn++;
  const keep = B.pw.retainAll ? B.p.block : Math.min(B.p.block, B.retainNext || 0);
  B.retainNext = 0;
  const nt = B.nt; B.nt = { draw: 0, energy: 0, block: 0, atk: 0 };
  B.t = { plays: 0, cardsPlayed: 0, atkPlayed: 0, skillPlayed: 0, zeroPlayed: 0, lostHp: false, hpStrCount: 0, firstHit: false, thorns: 0, thornsBurn: 0, nextAtk: nt.atk || 0 };
  B.p.block = keep + nt.block;
  B.p.tempStr = B.pw.startTempStr || 0;
  B.p.energy = 3 + (B.pw.startEnergy || 0) + nt.energy;
  if (B.pw.startLoseHp) hurtPlayer(B.pw.startLoseHp, { pierce: true, self: true });
  if (B.pw.startMana) gainMana(B.pw.startMana);
  for (const e of living()) {
    if (B.pw.startBurnAll) e.burn += B.pw.startBurnAll;
    if (B.pw.startPoisonAll) e.poison += B.pw.startPoisonAll + (B.pw.poisonBonus || 0);
    if (B.pw.startMarkAll) e.mark += B.pw.startMarkAll;
  }
  if (B.pw.startZap) { const e = living()[rnd(living().length)]; if (e) hurtEnemy(e, B.pw.startZap, false); }
  drawCards(Math.max(1, 5 + (B.pw.startDraw || 0) + nt.draw));
  if (B.pw.startArrow) addToHand('tok_arrow', B.pw.startArrow);
  B.phase = 'player';
  checkEnd();
}

async function endPlayerTurn() {
  if (B.phase !== 'player' || B.over) return;
  B.phase = 'enemy';
  if (B.pw.endBlock) B.p.block += B.pw.endBlock;
  if (B.pw.endHeal) G.hp = Math.min(G.maxHp, G.hp + B.pw.endHeal);
  if (B.pw.endMana) gainMana(B.pw.endMana);
  if (B.pw.endManaAoe && B.p.mana > 0) for (const e of living()) hurtEnemy(e, B.p.mana * B.pw.endManaAoe, false);
  if (B.pw.endLoseHp) hurtPlayer(B.pw.endLoseHp, { pierce: true, self: true });
  B.retainNext = Math.max(0, B.retainNext);
  B.discard.push(...B.hand.splice(0));
  if (B.p.weak > 0) B.p.weak--;
  if (B.p.vuln > 0) B.p.vuln--;
  for (const e of B.enemies) if (e.mark > 0 && !B.pw.marksPersist) e.mark--;
  ui.render();
  if (checkEnd()) return;
  await enemyPhase();
  if (checkEnd()) return;
  startPlayerTurn();
}

function enemyDamage(e, raw) {
  let d = Math.round(raw * DIFF[G.opts.diff].dmg * (e.dmgMul || 1)) + e.str;
  if (e.weak > 0) d = Math.floor(d * .75);
  if (B.p.vuln > 0) d = Math.floor(d * 1.5);
  return Math.max(0, d);
}

async function enemyPhase() {
  for (const e of B.enemies) {
    if (e.hp <= 0) continue;
    e.block = 0;
    if (e.poison > 0) { hurtEnemy(e, e.poison, true); e.poison--; ui.render(); await ui.wait(260); }
    if (e.hp > 0 && e.burn > 0) { hurtEnemy(e, e.burn, true); e.burn = Math.max(0, e.burn - 2); ui.render(); await ui.wait(260); }
  }
  if (checkEnd()) return;
  for (const e of living()) {
    const m = e.intent;
    ui.fx('act', e);
    await ui.wait(280);
    if (m.b) e.block += Math.round(m.b * (e.dmgMul || 1));
    if (m.str) e.str += m.str;
    if (m.debuff) { B.p[m.debuff[0]] += m.debuff[1]; }
    if (m.d) {
      for (let k = 0; k < (m.t || 1); k++) {
        let d = enemyDamage(e, m.d);
        if (B.pw.firstHitHalf && !B.t.firstHit) d = Math.ceil(d / 2);
        B.t.firstHit = true;
        hurtPlayer(d);
        const th = (B.t.thorns || 0) + (B.pw.thorns || 0);
        if (th) hurtEnemy(e, th, false);
        if (B.t.thornsBurn) e.burn += B.t.thornsBurn;
        ui.render();
        await ui.wait(240);
        if (G.hp <= 0 || e.hp <= 0) break;
      }
    }
    ui.render();
    if (checkEnd()) return;
    await ui.wait(220);
  }
  for (const e of B.enemies) {
    if (e.hp <= 0) continue;
    if (e.weak > 0) e.weak--;
    if (e.vuln > 0) e.vuln--;
    const mv = ENEMY_DEFS[e.id].moves;
    e.mi++; e.intent = mv[e.mi % mv.length];
  }
}

/* ---------- 出牌 ---------- */
function isXCard(def) { return def.cost < 0; }
function costOf(card) {
  const def = CARDS[card.id];
  if (isXCard(def)) return -1;
  let c = def.cost;
  if (card.free) return 0;
  if ((B.t.freeCards || 0) > 0) return 0;
  if (B.pw.firstFree && B.t.cardsPlayed === 0) return 0;
  if (B.t.nextAtkFree && def.type === 'attack') c = 0;
  if (B.t.nextCost) c = Math.max(0, c + B.t.nextCost);
  return c;
}
function needsTarget(card) {
  const def = CARDS[card.id];
  return def.ops.some(o => (o.op === 'dmg' && !o.all && !o.rand) || (o.op === 'status' && !o.all) || o.op === 'poisonDouble');
}
function canPlay(card) {
  if (B.phase !== 'player' || B.over) return { ok: false, why: '現在不能出牌' };
  if (B.t.plays >= MAX_PLAY) return { ok: false, why: `每回合最多出 ${MAX_PLAY} 張牌` };
  const def = CARDS[card.id];
  const c = isXCard(def) ? 0 : costOf(card);
  if (c > B.p.energy) return { ok: false, why: '能量不夠' };
  return { ok: true };
}

function condTrue(c, ctx) {
  const t = ctx.target;
  switch (c) {
    case 'hasBlock': return B.p.block > 0;
    case 'vuln': return !!t && t.vuln > 0;
    case 'burn': return !!t && t.burn > 0;
    case 'mark': case 'targetMark': return !!t && t.mark > 0;
    case 'mark3': return !!t && t.mark >= 3;
    case 'poison': return !!t && t.poison > 0;
    case 'hpLow': return G.hp * 2 < G.maxHp;
    case 'lostHp': return !!B.t.lostHp;
    case 'atkPlayed': return B.t.atkPlayed > 0;
    case 'firstCard': return B.t.cardsPlayed === 0;
    case 'enemyWeak': return living().some(e => e.weak > 0);
    case 'skillPlayed': return B.t.skillPlayed > 0;
    case 'handLE2': return B.hand.length <= 2;
  }
  return false;
}
const applyCond = (n, cd) => cd.t === 'add' ? n + cd.v : cd.t === 'set' ? cd.v : n * cd.v;
const countOf = c => ({ atkPlayed: B.t.atkPlayed, cardPlayed: B.t.cardsPlayed, zeroPlayed: B.t.zeroPlayed, mana: B.p.mana }[c] || 0);

function calcHit(base, e, ctx, first) {
  let d = base + B.p.str + B.p.tempStr + (B.pw.hitBonus || 0);
  if (e.mark > 0) d += e.mark;
  if (ctx.zero) d += (B.pw.zeroDmg || 0) + (B.t.zeroDmgTurn || 0);
  if (first) { d += ctx.firstBonus + ctx.sb; ctx.firstBonus = 0; ctx.sb = 0; }
  if (ctx.mult > 1) d *= ctx.mult;
  if (B.p.weak > 0) d = Math.floor(d * .75);
  if (e.vuln > 0) d = Math.floor(d * 1.5);
  return Math.max(0, d);
}

async function runOps(def, ctx) {
  for (const o of def.ops) {
    if (B.over || ctx.abort) break;
    await runOp(o, ctx, def);
  }
}

async function runOp(o, ctx, def) {
  const tgt = () => ctx.target && ctx.target.hp > 0 ? ctx.target : firstLiving();
  switch (o.op) {
    case 'dmg': {
      let n = o.n;
      const t0 = tgt();
      ctx.target = t0;
      if (o.scale) {
        const s = o.scale;
        const src = s.src === 'block' ? B.p.block : s.src === 'mana' ? B.p.mana : s.src === 'burn' ? (t0 ? t0.burn : 0) : s.src === 'poison' ? (t0 ? t0.poison : 0) : 0;
        n = Math.ceil(src * s.k);
        if (s.consume) { if (s.src === 'mana') B.p.mana = 0; if (s.src === 'burn' && t0) t0.burn = 0; }
        if (n <= 0) break;
      }
      if (o.cond && condTrue(o.cond.c, ctx)) n = applyCond(n, o.cond);
      if (o.per) n += o.per.v * countOf(o.per.c);
      const hits = o.hits === 'X' ? ctx.X : o.hits === 'X+1' ? ctx.X + 1 : o.hits;
      if (hits <= 0) break;
      for (let i = 0; i < hits; i++) {
        if (B.over) break;
        let targets;
        if (o.all) targets = living();
        else if (o.rand) { const l = living(); targets = l.length ? [l[rnd(l.length)]] : []; }
        else targets = ctx.target && ctx.target.hp > 0 ? [ctx.target] : [];
        for (const e of targets) {
          const first = !ctx.bonusUsed;
          const d = calcHit(n, e, ctx, first);
          ctx.bonusUsed = true;
          hurtEnemy(e, d, false);
          ctx.hit.add(e);
        }
        ui.render();
        if (hits > 1 || o.all) await ui.wait(110);
        if (!living().length) break;
      }
      ctx.dmgDone = true;
      break;
    }
    case 'block': {
      let n = o.n;
      if (o.scale) n = Math.ceil((o.scale.src === 'hand' ? B.hand.length : B.p.mana) * o.scale.k);
      if (o.cond && condTrue(o.cond.c, ctx)) n = applyCond(n, o.cond);
      if (n <= 0) break;
      n += ctx.sb; ctx.sb = 0;
      B.p.block += n; ui.fx('block', null, n);
      break;
    }
    case 'heal': if (o.only && !condTrue(o.only, ctx)) break; G.hp = Math.min(G.maxHp, G.hp + o.n); ui.fx('heal', null, o.n); break;
    case 'loseHp': hurtPlayer(o.n, { pierce: true, self: true }); break;
    case 'draw': if (o.only && !condTrue(o.only, ctx)) break; drawCards(o.n); break;
    case 'energy': B.p.energy += o.n; break;
    case 'mana': gainMana(o.n); break;
    case 'payMana': if (B.p.mana < o.n) ctx.abort = true; else B.p.mana -= o.n; break;
    case 'manaDouble': gainMana(B.p.mana); break;
    case 'str': B.p.str += o.n; break;
    case 'tempStr': B.p.tempStr += o.n; break;
    case 'status': {
      const targets = o.all ? living() : [tgt()].filter(Boolean);
      for (const e of targets) {
        let n = o.n;
        if (o.s === 'poison') n += (B.pw.poisonBonus || 0);
        e[o.s] += n;
        ui.fx('status', e, 0);
      }
      if (!o.all) ctx.target = targets[0];
      break;
    }
    case 'poisonDouble': { const e = tgt(); if (e) e.poison *= 2; break; }
    case 'discard': {
      if (!B.hand.length) break;
      let picked;
      if (B.hand.length <= o.n) picked = B.hand.slice();
      else picked = await ui.choose({ title: `選 ${o.n} 張牌丟掉`, cards: B.hand.slice(), count: o.n, from: 'hand' });
      for (const c of picked) {
        const i = B.hand.findIndex(x => x.uid === c.uid);
        if (i >= 0) { B.discard.push(B.hand.splice(i, 1)[0]); if (B.pw.discardBlock) B.p.block += B.pw.discardBlock; }
      }
      break;
    }
    case 'scry': {
      ensureDraw(o.look);
      const top = B.draw.splice(0, Math.min(o.look, B.draw.length));
      if (!top.length) break;
      const pick = await ui.choose({ title: `從牌庫頂 ${top.length} 張牌選 ${Math.min(o.pick, top.length)} 張拿到手上`, cards: top.slice(), count: Math.min(o.pick, top.length), from: 'draw' });
      const ids = new Set(pick.map(c => c.uid));
      for (const c of top) {
        if (ids.has(c.uid)) { if (B.hand.length >= HAND_MAX) B.discard.push(c); else B.hand.push(c); }
      }
      const rest = top.filter(c => !ids.has(c.uid));
      if (o.discardRest) B.discard.push(...rest); else B.draw.unshift(...rest);
      break;
    }
    case 'fetch': {
      const pool = B.discard.filter(c => o.type === 'any' || CARDS[c.id].type === o.type);
      if (!pool.length) break;
      const pick = await ui.choose({ title: o.to === 'top' ? '選 1 張放回牌庫最上面' : '從棄牌堆選 1 張拿回手上', cards: pool.slice(), count: 1, from: 'discard' });
      for (const c of pick) {
        const i = B.discard.findIndex(x => x.uid === c.uid);
        if (i < 0) continue;
        const [card] = B.discard.splice(i, 1);
        if (o.to === 'top') B.draw.unshift(card); else if (B.hand.length >= HAND_MAX) B.discard.push(card); else B.hand.push(card);
      }
      break;
    }
    case 'addCard': addToHand(o.id, o.n); break;
    case 'pickFree': {
      const pool = B.hand.filter(c => !c.free && CARDS[c.id].cost !== 0);
      if (!pool.length) break;
      const pick = await ui.choose({ title: '選 1 張牌，本回合費用變 0', cards: pool.slice(), count: 1, from: 'hand' });
      for (const c of pick) { const h = B.hand.find(x => x.uid === c.uid); if (h) h.free = true; }
      break;
    }
    case 'cleanse': { let k = o.n; for (const s of ['weak', 'vuln']) if (k > 0 && B.p[s] > 0) { B.p[s] = 0; k--; } break; }
    case 'loseAllBlock': B.p.block = 0; break;
    case 'retain': B.retainNext += o.n; break;
    case 'nextTurn': B.nt[o.k] += o.n; break;
    case 'nextAtk': B.t.nextAtk = (B.t.nextAtk || 0) + o.n; break;
    case 'nextAtkMult': B.t.nextAtkMult = Math.max(B.t.nextAtkMult || 1, o.n); break;
    case 'nextAtkTwice': B.t.nextAtkTwice = true; break;
    case 'nextAtkFree': B.t.nextAtkFree = true; break;
    case 'nextCost': B.t.nextCost = (B.t.nextCost || 0) + o.n; break;
    case 'freeCards': B.t.freeCards = (B.t.freeCards || 0) + o.n; break;
    case 'zeroDmgTurn': B.t.zeroDmgTurn = (B.t.zeroDmgTurn || 0) + o.n; break;
    case 'atkPoisonTurn': B.t.atkPoisonTurn = (B.t.atkPoisonTurn || 0) + o.n; break;
    case 'poisonPerCardTurn': B.t.poisonPerCardTurn = (B.t.poisonPerCardTurn || 0) + o.n; break;
    case 'thorns': B.t.thorns += o.n; break;
    case 'thornsBurn': B.t.thornsBurn += o.n; break;
    case 'pw': B.pw[o.k] = (B.pw[o.k] || 0) + o.n; if (o.k === 'startLoseHp' || o.k === 'endLoseHp') {} break;
  }
}

/* 打出一張牌：先付費、回答問題，答對才發動 */
async function playCard(uid, targetIdx) {
  const idx = B.hand.findIndex(c => c.uid === uid);
  if (idx < 0) return { err: '找不到這張牌' };
  const card = B.hand[idx], def = CARDS[card.id];
  const can = canPlay(card);
  if (!can.ok) return { err: can.why };
  let cost = costOf(card), X = 0;
  if (isXCard(def)) { X = B.p.energy; cost = X; }
  /* 消耗各種「下一張牌」的費用優惠 */
  if (!card.free && !isXCard(def)) {
    if ((B.t.freeCards || 0) > 0) B.t.freeCards--;
    else if (B.pw.firstFree && B.t.cardsPlayed === 0) { /* 第一張免費 */ }
    else {
      if (B.t.nextAtkFree && def.type === 'attack') B.t.nextAtkFree = false;
      if (B.t.nextCost) B.t.nextCost = 0;
    }
  }
  B.p.energy -= cost;
  B.t.plays++;
  B.hand.splice(idx, 1);
  B.phase = 'quiz';
  ui.render();

  const ctx = { X, target: B.enemies[targetIdx] && B.enemies[targetIdx].hp > 0 ? B.enemies[targetIdx] : firstLiving(), hit: new Set(), firstBonus: 0, sb: 0, mult: 1, zero: cost === 0 };
  G.stats.asked++;
  const ok = await ui.quiz(card, def);
  B.phase = 'player';

  if (!ok) {
    G.streak = 0; G.stats.curStreak = 0;
    B.discard.push(card);
    ui.render();
    return { ok: false };
  }
  G.stats.correct++; G.stats.played++;
  G.stats.curStreak++; G.stats.maxStreak = Math.max(G.stats.maxStreak, G.stats.curStreak);
  if (G.opts.streak) {
    if (G.streak >= 3) { ctx.sb = 2; G.streak = 0; } else G.streak++;
  }
  /* 攻擊牌的各種加成 */
  if (def.type === 'attack' && def.ops.some(o => o.op === 'dmg')) {
    ctx.firstBonus = (B.t.nextAtk || 0) + (B.pw.firstAtk && B.t.atkPlayed === 0 ? B.pw.firstAtk : 0) + (B.pw.third3Atk && B.t.cardsPlayed + 1 >= 3 ? B.pw.third3Atk : 0);
    ctx.mult = B.t.nextAtkMult || 1;
    B.t.nextAtk = 0; B.t.nextAtkMult = 0;
  }
  const twice = def.type === 'attack' && B.t.nextAtkTwice;
  if (twice) B.t.nextAtkTwice = false;
  await runOps(def, ctx);
  if (twice && !B.over) { ctx.abort = false; await runOps(def, ctx); }

  /* 攻擊後的附加效果 */
  if (def.type === 'attack' && ctx.hit.size) {
    for (const e of ctx.hit) {
      const p = (B.pw.atkPoison || 0) + (B.t.atkPoisonTurn || 0);
      if (p) e.poison += p + (B.pw.poisonBonus || 0);
      if (B.pw.atkBurn) e.burn += B.pw.atkBurn;
      if (B.pw.atkMarkHeal) { e.mark += B.pw.atkMarkHeal; G.hp = Math.min(G.maxHp, G.hp + B.pw.atkMarkHeal); }
    }
  }
  /* 出牌後觸發的能力 */
  const target = ctx.target;
  B.t.cardsPlayed++;
  if (def.type === 'attack') B.t.atkPlayed++;
  if (def.type === 'skill') B.t.skillPlayed++;
  const zero = cost === 0;
  if (zero) {
    B.t.zeroPlayed++;
    if (B.pw.zeroBlock) B.p.block += B.pw.zeroBlock;
    if (B.pw.zeroDraw && B.t.zeroPlayed === 1) drawCards(B.pw.zeroDraw);
  }
  if (def.type === 'attack' && B.pw.atkBlock) B.p.block += B.pw.atkBlock;
  if (def.type === 'skill') { if (B.pw.skillBlock) B.p.block += B.pw.skillBlock; if (B.pw.skillMana) gainMana(B.pw.skillMana); }
  if (B.pw.third && def.type === 'attack' && B.t.atkPlayed === 3) drawCards(B.pw.third);
  if (B.pw.every3Mana && G.stats.played % 3 === 0) gainMana(B.pw.every3Mana);
  if (B.pw.playAoe) for (const e of living()) hurtEnemy(e, B.pw.playAoe, false);
  if (B.pw.fifthAoe && B.t.cardsPlayed === 5) for (const e of living()) hurtEnemy(e, B.pw.fifthAoe, false);
  if (B.t.poisonPerCardTurn) { const e = target && target.hp > 0 ? target : firstLiving(); if (e) e.poison += B.t.poisonPerCardTurn + (B.pw.poisonBonus || 0); }

  /* 牌的去向 */
  if (def.power) { /* 能力牌留在場上，不進棄牌堆 */ }
  else if (def.exhaust) B.exhaust.push(card);
  else B.discard.push(card);
  checkEnd();
  ui.render();
  return { ok: true };
}

/* ---------- 獎勵 ---------- */
function rewardChoices() {
  const tier = G.floors[G.floor].tier !== 'normal' ? 'elite' : 'normal';
  const w = tier === 'elite' ? { common: 35, uncommon: 45, rare: 20 } : { common: 62, uncommon: 31, rare: 7 };
  const pool = POOLS[G.cls];
  const out = [];
  let guard = 0;
  while (out.length < 3 && guard++ < 200) {
    let r = rnd(100), rar = 'common';
    if (r >= w.common) rar = r < w.common + w.uncommon ? 'uncommon' : 'rare';
    const cand = pool.filter(id => CARDS[id].rarity === rar && !out.includes(id));
    if (cand.length) out.push(cand[rnd(cand.length)]);
  }
  return out;
}
function battleHeal() {
  /* 一般關回復最大生命的 15%；菁英或 BOSS 關回復 30% */
  const strong = G.floors[G.floor].tier !== 'normal';
  const n = Math.ceil(G.maxHp * (strong ? .3 : .15));
  const before = G.hp;
  G.hp = Math.min(G.maxHp, G.hp + n);
  return G.hp - before;
}
/* 排行榜模式：可以選擇回復最大生命的 20% */
function healPct(p) { const n = Math.ceil(G.maxHp * p), before = G.hp; G.hp = Math.min(G.maxHp, G.hp + n); return G.hp - before; }
const isLastFloor = () => G.floor >= G.floors.length - 1;

/* ---------- 題庫 ---------- */
function pickQuestion(bank, enabledSubjects, rarity, used) {
  let pool = bank.filter(q => !enabledSubjects || enabledSubjects.has(q.subject || '未分類'));
  if (!pool.length) pool = bank.slice();
  if (!pool.length) return null;
  const want = rarity === 'rare' ? 3 : rarity === 'uncommon' ? 2 : 1;
  const fresh = pool.filter(q => !used.has(q.id));
  let src = fresh.length ? fresh : (used.clear(), pool);
  let exact = src.filter(q => !q.diff || q.diff === want);
  if (!exact.length) {
    const best = Math.min(...src.map(q => Math.abs(q.diff - want)));
    exact = src.filter(q => Math.abs(q.diff - want) === best);
  }
  const q = exact[rnd(exact.length)];
  used.add(q.id);
  return q;
}

const icon = (n, s = 24, sw = 1.8) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.star}</svg>`;
function artFor(def) {
  if (def.power) return 'star';
  const ops = def.ops.map(o => o.op + (o.s ? ':' + o.s : ''));
  const has = k => ops.includes(k);
  if (has('dmg')) {
    if (def.cls === 'warrior') return 'sword';
    if (def.cls === 'mage') return def.ops.some(o => o.op === 'status' && o.s === 'burn') ? 'flame' : 'bolt';
    if (def.cls === 'archer') return 'bow';
    if (def.cls === 'rogue') return 'dagger';
    return 'sword';
  }
  if (has('status:poison') || has('poisonDouble')) return 'drop';
  if (has('status:burn')) return 'flame';
  if (has('status:mark')) return 'target';
  if (has('block')) return 'shield';
  if (has('draw') || has('scry') || has('fetch') || has('discard')) return 'book';
  if (has('mana') || has('manaDouble') || has('payMana')) return 'crystal';
  if (has('heal')) return 'heart';

const DIFFMAP = { '1': 1, '2': 2, '3': 3, '簡單': 1, '易': 1, '基礎': 1, 'easy': 1, '普通': 2, '一般': 2, '中等': 2, '中': 2, 'medium': 2, '困難': 3, '難': 3, '進階': 3, 'hard': 3 };
const normDiff = v => DIFFMAP[String(v == null ? '' : v).trim().toLowerCase()] || 0;
function parseRows(text, delim) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c;
    } else if (c === '"' && cur === '') inQ = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
function resolveAnswer(a, cells, opts, map) {
  const s = String(a == null ? '' : a).trim();
  if (!s) return -1;
  if (/^[A-Fa-f]$/.test(s)) { const p = s.toUpperCase().charCodeAt(0) - 65; return p in map ? map[p] : -1; }
  const ti = opts.findIndex(o => o === s);
  if (ti >= 0) return ti;
  if (/^[1-6]$/.test(s)) { const p = +s - 1; return p in map ? map[p] : -1; }

}
function buildQ(q, cells, ansRaw, subject, diff, exp, lineNo, errors, idp) {
  q = (q || '').trim();
  if (!q) { errors.push(`第 ${lineNo} 列：沒有題目`); return null; }
  const opts = [], map = {};
  cells.forEach((c, i) => { const t = String(c == null ? '' : c).trim(); if (t) { map[i] = opts.length; opts.push(t); } });
  if (opts.length < 2) { errors.push(`第 ${lineNo} 列：至少要有 2 個選項`); return null; }
  if (opts.length > 6) { errors.push(`第 ${lineNo} 列：最多 6 個選項`); return null; }
  const ans = resolveAnswer(ansRaw, cells, opts, map);
  if (ans < 0) { errors.push(`第 ${lineNo} 列：答案「${ansRaw}」對不到任何選項`); return null; }
  return { id: idp + lineNo, q, opts, ans, subject: (subject || '').trim() || '未分類', diff: normDiff(diff), exp: (exp || '').trim() };
}
function parseQuestions(raw) {
  const t = String(raw || '').replace(/^﻿/, '').trim();
  const errors = [], items = [], idp = 'u' + Date.now().toString(36) + '_';
  if (!t) return { items, errors: ['內容是空的'] };
  if (t[0] === '[' || t[0] === '{') {
    let data;
    try { data = JSON.parse(t); } catch (e) { return { items, errors: ['JSON 格式有誤：' + e.message] }; }
    if (!Array.isArray(data)) data = data.questions || data.題目 || [];
    data.forEach((o, i) => {
      let cells = o.options || o.choices || o.opts || o['選項'];
      if (!Array.isArray(cells)) cells = ['A', 'B', 'C', 'D', 'E', 'F'].map(k => o[k] != null ? o[k] : o['選項' + k]).filter(x => x != null);
      let a = o.answer != null ? o.answer : o.ans != null ? o.ans : o['答案'];
      if (typeof a === 'number') a = String.fromCharCode(65 + a);
      const it = buildQ(o.q || o.question || o['題目'] || o['題幹'], cells, a, o.subject || o['科目'], o.difficulty || o.level || o['難度'], o.explanation || o.exp || o['解析'], i + 1, errors, idp);
      if (it) items.push(it);
    });
    return { items, errors };
  }
  const first = t.split(/\r?\n/)[0];
  const delim = first.includes('\t') ? '\t' : ',';
  const rows = parseRows(t, delim);
  if (!rows.length) return { items, errors: ['讀不到任何列'] };
  const head = rows[0].map(x => x.trim());
  const hasHead = /^(題目|題幹|question|q)$/i.test(head[0]);
  let col = { q: 0, opts: [1, 2, 3, 4], ans: 5, sub: 6, diff: 7, exp: 8 };
  if (hasHead) {
    col = { q: -1, opts: [], ans: -1, sub: -1, diff: -1, exp: -1 };
    head.forEach((h, i) => {
      if (/^(題目|題幹|question|q)$/i.test(h)) col.q = i;
      else if (/^(答案|正解|解答|answer|ans)$/i.test(h)) col.ans = i;
      else if (/^(科目|類別|subject|category)$/i.test(h)) col.sub = i;
      else if (/^(難度|level|difficulty)$/i.test(h)) col.diff = i;
      else if (/^(解析|說明|explanation|exp)$/i.test(h)) col.exp = i;
      else { const m = h.match(/^(?:選項|option)?\s*([A-F1-6])$/i); if (m) col.opts.push(i); }
    });
    if (col.q < 0 || col.ans < 0 || col.opts.length < 2) return { items, errors: ['標題列要有：題目、選項A、選項B…、答案'] };
  }
  rows.slice(hasHead ? 1 : 0).forEach((r, i) => {
    const line = i + (hasHead ? 2 : 1);
    const g = k => (k >= 0 && k < r.length ? r[k] : '');
    const cells = col.opts.map(k => g(k));
    const it = buildQ(g(col.q), cells, g(col.ans), g(col.sub), g(col.diff), g(col.exp), line, errors, idp);
    if (it) items.push(it);
  });

}

/* ---------- 卡牌 ---------- */
function cardHTML(card, o = {}) {
  const inst = typeof card === 'string' ? { id: card } : card;
  const def = CARDS[inst.id];
  let cost = def.cost < 0 ? 'X' : def.cost;
  if (o.live && B) { const c = costOf(inst); cost = c < 0 ? 'X' : c; }
  const tag = o.tag || 'div';
  const cls = ['card', 't-' + def.type, 'r-' + def.rarity, def.power ? 'pwr' : '', o.size || '', o.sel ? 'sel' : '', o.dis ? 'dis' : '', o.chosen ? 'chosen' : '', o.extra || ''].filter(Boolean).join(' ');
  const attrs = (o.attrs || '') + (o.style ? ` style="${o.style}"` : '');
  const aria = `${def.name}，${TYPE_ZH[def.type]}，費用 ${cost}，${def.desc}`;
  return `<${tag} class="${cls}" ${tag === 'button' ? 'type="button"' : ''} aria-label="${esc(aria)}" ${attrs}>
    <span class="cost">${cost}</span><span class="cname">${esc(def.name)}</span>
    <span class="art">${icon(artFor(def), o.size === 'mini' ? 22 : 30, 1.7)}</span>
    <span class="ctype">${TYPE_ZH[def.type]}</span><span class="cdesc">${esc(def.desc)}</span><i class="rar"></i></${tag}>`;
}

function routeHTML() {

function intentHTML(e) {
  const m = e.intent, parts = [];
  if (m.d) { const d = enemyDamage(e, m.d); parts.push(`${icon('sword', 16)} ${d}${m.t ? '×' + m.t : ''}`); }
  if (m.b) parts.push(`${icon('shield', 16)} ${m.b}`);

function statChips(o, isFoe) {

  if (o.weak > 0) c.push(`<span class="stat bad" title="虛弱：造成的傷害 -25%">虛弱 ${o.weak}</span>`);
  if (o.vuln > 0) c.push(`<span class="stat bad" title="脆弱：受到的傷害 +50%">脆弱 ${o.vuln}</span>`);
  if (isFoe) {
    if (o.poison > 0) c.push(`<span class="stat bad" title="毒：回合開始扣血，之後 -1">毒 ${o.poison}</span>`);
    if (o.burn > 0) c.push(`<span class="stat warn" title="灼燒：回合開始扣血，之後 -2">灼燒 ${o.burn}</span>`);
    if (o.mark > 0) c.push(`<span class="stat warn" title="標記：每次被攻擊多受 ${o.mark} 點傷害，回合結束減少 1 層">標記 ${o.mark}（每下 +${o.mark}）</span>`);

/* 浮動數字與音效 */
function floatAt(el, text, cls) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.textContent = text;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height * .25) + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}
ui.fx = (type, e, val) => {
  if (S.screen !== 'battle') return;
  if (type === 'dmg') { S.hitAt[e.i] = Date.now(); floatAt($(`.foe[data-i="${e.i}"] .sprite`), '−' + val, 'dmg'); sfx.hit(); }
  else if (type === 'pdmg') { S.hitAt.p = Date.now(); floatAt($('#pbox .ava'), '−' + val, 'pdmg'); sfx.hit(); }
  else if (type === 'heal') floatAt($('#pbox .ava'), '+' + val, 'heal');
  else if (type === 'block') floatAt($('#pbox .ava'), '護甲 +' + val, 'block');
  else if (type === 'act') S.actAt[e.i] = Date.now();
};
ui.wait = ms => wait(ms);
ui.render = () => { if (S.screen === 'battle') renderBattle(false); };

/* 回答問題 */
ui.quiz = (card, def) => new Promise(resolve => {
  const q = pickQuestion(S.bank, enabledSet(), def.rarity, S.used);
  if (!q) { resolve(true); return; }
  const order = shuffle([...q.opts.keys()]);
  S.quiz = { q, order, resolve, answered: false, card, def, ok: null };
  drawQuiz();
});
function drawQuiz() {
  const z = S.quiz, m = $('#m-quiz');
  const { q, order, def } = z;
  const letters = 'ABCDEF';
  const rarZh = { common: '普通牌', uncommon: '罕見牌', rare: '稀有牌', basic: '基礎牌', token: '衍生牌' }[def.rarity] || '';
  m.innerHTML = `<div class="quiz" role="dialog" aria-modal="true" aria-labelledby="qtxt">
    <div class="meta"><span class="tagc">出牌：${esc(def.name)}</span><span>${rarZh}</span>${q.subject && q.subject !== '未分類' ? `<span class="sub">${esc(q.subject)}</span>` : ''}${q.diff ? `<span>難度 ${q.diff}</span>` : ''}</div>
    <div class="q" id="qtxt">${esc(q.q)}</div>
    <div class="opts">${order.map((oi, k) => `<button class="opt ${z.answered ? (oi === q.ans ? 'right' : oi === z.picked ? 'wrong' : '') : ''}" data-act="ans" data-i="${oi}" ${z.answered ? 'disabled' : ''}><span class="ltr">${letters[k]}</span><span>${esc(q.opts[oi])}</span></button>`).join('')}</div>
    ${z.answered ? `<div class="fb ${z.ok ? 'ok' : 'no'}" role="status">${z.ok ? '答對了！牌的效果發動！' : '答錯了，這張牌沒有發動。'}${!z.ok ? `<small>正確答案：${esc(q.opts[q.ans])}${q.exp ? '　' + esc(q.exp) : ''}</small>` : (q.exp ? `<small>${esc(q.exp)}</small>` : '')}</div>
    <div class="go"><button class="btn small" data-act="quiz-next" id="quiz-next">繼續</button></div>` : '<p class="note" style="margin-top:14px;color:var(--ink-2);font-size:.88rem">按選項，或按鍵盤 1–4／A–D</p>'}
  </div>`;
  m.hidden = false;
  const nb = $('#quiz-next'); if (nb) nb.focus();
}
function answerQuiz(oi) {
  const z = S.quiz; if (!z || z.answered) return;
  z.answered = true; z.picked = oi; z.ok = oi === z.q.ans;
  if (z.ok) sfx.ok(); else {
    sfx.bad();
    G.missed.push({ q: z.q.q, ans: z.q.opts[z.q.ans], pick: z.q.opts[oi], exp: z.q.exp });
  }
  drawQuiz();
  if (z.ok) z.timer = setTimeout(closeQuiz, 1100);
}
function closeQuiz() {
  const z = S.quiz; if (!z) return;
  clearTimeout(z.timer); S.quiz = null;
  $('#m-quiz').hidden = true; $('#m-quiz').innerHTML = '';
  z.resolve(z.ok);
}

/* 選牌彈窗 */
ui.choose = spec => new Promise(resolve => {
  const picked = new Set();
  const m = $('#m-sheet');
  const need = Math.min(spec.count, spec.cards.length);
  const draw = () => {
    m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(spec.title)}</h3><div class="cardgrid">${spec.cards.map(c => cardHTML(c, { tag: 'button', chosen: picked.has(c.uid), attrs: `data-act="pick" data-uid="${c.uid}"` })).join('')}</div>
      <div class="row" style="justify-content:flex-end"><span class="note">已選 ${picked.size} / ${need}</span><button class="btn small" data-act="choose-ok" ${picked.size === need ? '' : 'disabled'}>確定</button></div></div>`;
    m.hidden = false;
  };
  S.choose = { picked, draw, done: () => { m.hidden = true; m.innerHTML = ''; S.choose = null; resolve(spec.cards.filter(c => picked.has(c.uid))); }, need };
  draw();
});

function showPile(kind) {
  let list, title;
  if (kind === 'draw') { list = B.draw.slice().sort((a, b) => CARDS[a.id].name.localeCompare(CARDS[b.id].name, 'zh-Hant')); title = `抽牌堆（${list.length} 張，順序是隨機的）`; }
  else if (kind === 'discard') { list = B.discard; title = `棄牌堆（${list.length} 張）`; }
  else if (kind === 'exhaust') { list = B.exhaust; title = `本場消耗掉的牌（${list.length} 張）`; }
  else { list = G.deck.map(id => ({ id })); title = `你的牌組（${list.length} 張）`; }
  const m = $('#m-sheet');
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><h3>${title}</h3><div class="cardgrid">${list.length ? list.map(c => cardHTML(c, { size: 'mini' })).join('') : '<p class="note">這裡沒有牌</p>'}</div><div class="row" style="justify-content:flex-end"><button class="btn small" data-act="close-sheet">關閉</button></div></div>`;

}

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, 1600);
}

/* ---------- 出牌流程 ---------- */
async function tryPlay(uid, ti) {
  if (S.busy || !B || B.over) return;
  S.busy = true; S.sel = null; S.targeting = null;
  renderBattle(false);
  const res = await playCard(uid, ti);
  S.busy = false;
  if (res.err) toast(res.err);
  renderBattle(false);
  checkFinish();
}
async function doEndTurn() {
  if (S.busy || !B || B.phase !== 'player') return;
  S.busy = true; S.sel = null; S.targeting = null;
  renderBattle(false);
  await endPlayerTurn();
  S.busy = false;
  renderBattle(false);
  checkFinish();

/* 自動判斷檔案編碼：UTF-8（含 BOM）、UTF-16、否則當成 Big5（Excel 在繁體 Windows 另存的 CSV） */
function decodeBytes(u8, force) {
  if (force && force !== 'auto') { try { return { text: new TextDecoder(force).decode(u8), enc: force === 'big5' ? 'Big5（手動）' : force === 'gbk' ? 'GBK（手動）' : 'UTF-8（手動）' }; } catch (e) {} }
  if (u8[0] === 0xFF && u8[1] === 0xFE) return { text: new TextDecoder('utf-16le').decode(u8), enc: 'UTF-16' };
  if (u8[0] === 0xFE && u8[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(u8), enc: 'UTF-16' };
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(u8), enc: 'UTF-8' }; } catch (e) {}
  for (const enc of ['big5', 'gbk']) {
    try { return { text: new TextDecoder(enc).decode(u8), enc: enc === 'big5' ? 'Big5' : 'GBK' }; } catch (e) {}
  }
  return { text: new TextDecoder('utf-8').decode(u8), enc: 'UTF-8（可能有亂碼）' };
}

/* ---------- 排行榜（線上 + 本機） ---------- */
const LB = { db: null, user: null, uid: null, canWrite: null, admin: false, rows: [], loading: false, slow: false, err: null, unsub: null, t: 0, init: null };
LB.init = (async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    LB.db = db; LB.user = user;
    if (user) { LB.uid = await user.id(); LB.canWrite = await user.can('data.write'); LB.admin = await user.canEdit(); }
  } catch (e) { LB.db = null; }
  if (S.screen === 'leaderboard') renderLB();
})();
/* 排序：通過關卡多的在前；50 關都通過的，再比答對率；其餘同關卡也用答對率分高低，最後比誰先達成 */
function cmpScore(a, b) {
  const fa = a.cleared >= RANK_FLOORS, fb = b.cleared >= RANK_FLOORS;
  if (fa && fb) return (b.acc - a.acc) || (a.at - b.at);
  return (b.cleared - a.cleared) || (b.acc - a.acc) || (a.at - b.at);
}
function cleanRow(id, d) {
  if (!d || typeof d !== 'object') return null;
  const cleared = Math.max(0, Math.min(RANK_FLOORS, Math.floor(Number(d.cleared)) || 0));
  const acc = Math.max(0, Math.min(1, Number(d.acc) || 0));
  return { id, name: String(d.name || '無名').slice(0, 12), cls: CLASSES[d.cls] ? d.cls : 'warrior', cleared, acc, asked: Number(d.asked) || 0, at: Number(d.at) || 0 };
}
const localScores = () => (store.get('kt_local_scores', []) || []).map((d, i) => cleanRow('L' + i, d)).filter(Boolean).sort(cmpScore);
function saveLocalScore(rec) {
  const all = (store.get('kt_local_scores', []) || []).concat([rec]).map((d, i) => cleanRow('L' + i, d)).filter(Boolean).sort(cmpScore).slice(0, 30);
  store.set('kt_local_scores', all.map(({ id, ...r }) => r));
}
function unsubLB() { if (LB.unsub) { try { LB.unsub(); } catch (e) {} LB.unsub = null; } clearTimeout(LB.t); LB.loading = false; }
function subscribeLB() {
  unsubLB();
  if (!LB.db) return;
  LB.loading = true; LB.slow = false; LB.err = null;
  LB.t = setTimeout(() => { if (LB.loading) { LB.slow = true; if (S.screen === 'leaderboard') renderLB(); } }, 10000);
  try {
    LB.unsub = LB.db.collection('scores').limit(1000).onSnapshot(snap => {
      LB.loading = false; LB.slow = false; clearTimeout(LB.t);
      LB.rows = snap.docs.map(d => cleanRow(d.id, d.data())).filter(Boolean).sort(cmpScore);
      if (S.screen === 'leaderboard') renderLB();
    }, e => { LB.loading = false; LB.err = (e && e.code) || 'error'; clearTimeout(LB.t); if (S.screen === 'leaderboard') renderLB(); });
  } catch (e) { LB.loading = false; LB.err = 'error'; }
}
/* 排行榜模式結束：存本機，並嘗試上傳（只有比自己原本的最佳成績好才會覆蓋） */
async function submitRank() {
  const st = G.stats, cleared = S.win ? G.floors.length : G.floor;
  const rec = { name: G.name, cls: G.cls, cleared, correct: st.correct, asked: st.asked, acc: st.asked ? Math.round(st.correct / st.asked * 10000) / 10000 : 0, at: Date.now() };
  saveLocalScore(rec);
  S.sub = { state: 'sending', rec };
  const done = r => { S.sub = Object.assign({ rec }, r); if (S.screen === 'end') renderEnd(); };
  await LB.init;
  if (!LB.db || !LB.uid) return done({ state: 'nocloud' });
  if (LB.canWrite === false) return done({ state: 'noperm' });
  try {
    const ref = LB.db.doc('scores/' + LB.uid);
    const snap = await ref.get();
    const old = snap.exists ? cleanRow(LB.uid, snap.data()) : null;
    let improved = true;
    if (old && cmpScore(rec, old) >= 0) improved = false;
    if (improved) await ref.set(rec);
    const all = await LB.db.collection('scores').limit(1000).get();
    const rows = all.docs.map(d => cleanRow(d.id, d.data())).filter(Boolean).sort(cmpScore);
    const idx = rows.findIndex(r => r.id === LB.uid);
    return done({ state: 'done', improved, best: old, rank: idx >= 0 ? idx + 1 : null, total: rows.length });
  } catch (e) {
    return done({ state: 'error', code: (e && e.code) || 'error' });
  }
}

    else if (LB.loading && !LB.rows.length) body = `<p class="note">${LB.slow ? '連線比較久，還在等排行榜資料…' : '讀取中…'}</p>`;
    else if (!LB.rows.length) body = `<p class="note">還沒有人上榜。打完一次排行榜模式，成績就會出現在這裡。</p>`;
    else body = `<div class="tablewrap"><table class="lb"><thead><tr><th>名次</th><th>玩家</th><th>成績</th><th>答對率</th>${LB.admin ? '<th></th>' : ''}</tr></thead><tbody>${LB.rows.slice(0, 100).map((r, i) => rowHTML(r, i, r.id === LB.uid, LB.admin)).join('')}</tbody></table></div>${LB.slow ? '<p class="note">資料可能不是最新的。</p>' : ''}`;
  } else {
    const rows = localScores();
    body = rows.length ? `<div class="tablewrap"><table class="lb"><thead><tr><th>名次</th><th>玩家</th><th>成績</th><th>答對率</th></tr></thead><tbody>${rows.map((r, i) => rowHTML(r, i, false, false)).join('')}</tbody></table></div><p class="note">這裡只有這台裝置上打過的紀錄，最多保留 30 筆。</p>` : `<p class="note">這台裝置還沒有排行榜模式的紀錄。</p>`;
  }
  app.innerHTML = `<div class="screen"><div class="topbar"><button class="btn small ghost" data-act="home">← 回首頁</button><h2>排行榜</h2><span class="spacer"></span><button class="btn small" data-act="start-rank">玩排行榜模式</button></div>
    <div class="row" style="margin-bottom:10px"><div class="seg" role="group" aria-label="排行榜範圍"><button data-act="lb-tab" data-v="online" aria-pressed="${online}">全部玩家</button><button data-act="lb-tab" data-v="local" aria-pressed="${!online}">這台裝置</button></div></div>
    <p class="note" style="margin-bottom:12px">排名方式：通過的關卡越多越前面。50 關全部通過的，再比答對率。每個人只留自己的最佳成績。</p>
    ${body}</div>`;
  const ns = app.querySelector('.screen'); if (ns) ns.scrollTop = top;
}
function openLB() { S.lbTab = LB.db ? 'online' : 'local'; S.delAsk = ''; go('leaderboard'); if (LB.db) subscribeLB(); else LB.init.then(() => { if (S.screen === 'leaderboard' && LB.db) { S.lbTab = 'online'; subscribeLB(); renderLB(); } }); }

/* ---------- 開始 ---------- */
loadBank();
render();

</script>

</body></html>
